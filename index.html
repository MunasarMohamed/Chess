            <!-- Promotion picker, shown over the board when a pawn reaches the last rank -->
            <div class="promotionPicker hidden" id="promotionPicker" onclick="cancelPromotion(event)">
                <div class="promotionChoices">
                    <img alt="queen" draggable="false" onclick="choosePromotion('queen')">
                    <img alt="rook" draggable="false" onclick="choosePromotion('rook')">
                    <img alt="bishop" draggable="false" onclick="choosePromotion('bishop')">

        <!-- Below the board: "New game" when a game has ended, and the online game (create a game, send the link, connection status) -->

            <div class="panelButtons">
                <button class="onlineButton hidden" id="newGameButton" onclick="startNewGame()">New game</button>
